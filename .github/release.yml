changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot

  categories:
    - title: "🚀 New Features"
      labels:
        - enhancement
        - feature

    - title: "🐛 Bug Fixes"
      labels:
        - bug

    - title: "🔧 Maintenance"
      labels:
        - maintenance
        - dependencies

    - title: "Other Changes"
      labels:
        - "*"
